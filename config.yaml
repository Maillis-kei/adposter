church:
  name: "포이에마성령교회"
  show_contact: false
  contact_number: "02-0000-0000"
  location: "대한민국 서울특별시"
  slogan: "성령의 임재와 말씀의 능력이 살아 숨쉬는 교회"

fonts:
  dir: "fonts"
  headline: "PyeongChangPeace-Bold.otf"   # 캘리그라피 헤드라인
  serif_bold: "MaruBuri-Bold.ttf"        # 감성 명조 볼드 (성경 출처/강조)
  serif_regular: "MaruBuri-Regular.ttf"  # 감성 명조 레귤러 (성경 본문/에세이)
  body_bold: "Pretendard-Bold.otf"        # 산세리프 볼드
  body_regular: "Pretendard-Regular.otf"  # 산세리프 레귤러

stationery:
  default_form_factor: "verse_card"      # verse_card, gospel_leaflet, devotional_postcard
  seal_stamp_text: "포이에마"             # 붉은 수제 전각(낙관 도장) 텍스트

guardrails:
  typesafe:
    risk_threshold: 0.3 # 0.0(완전 안전) ~ 1.0(고위험). 0.3 초과 시 탈락
    max_retries: 3
    model: "typesafe-jev-decision-v1"
  blacklist_path: "config/heresy_keywords.json"

image_generation:
  provider: "google-genai" # imagen 3
  model: "imagen-3.0-generate-002"
  aspect_ratio: "9:16"
  width: 1080
  height: 1920
  output_dir: "output"

email:
  enabled: true # Gmail 발송 활성화 (GMAIL_USER & GMAIL_APP_PASSWORD 사용)

drive:
  enabled: false # Google Drive 연동은 추후 설정 시 true로 전환
  folder_id: ""
  service_account_path: "service_account.json"
