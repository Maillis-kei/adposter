name: Daily Gospel Poster Automation

on:
  workflow_dispatch:
    inputs:
      topic:
        description: '특정 포스터 주제 (비워둘 시 자동 기획)'
        required: false
        default: ''
      form_factor:
        description: '폼팩터 (verse_card, gospel_leaflet, devotional_postcard)'
        required: false
        default: 'verse_card'
      dry_run:
        description: '발송/업로드 제외 로컬 테스트 여부'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Poster Automation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAILS: ${{ secrets.RECEIVER_EMAILS }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SERVICE_ACCOUNT_JSON_PATH: service_account.json
        run: |
          CMD="python main.py"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ -n "${{ inputs.topic }}" ]; then
            CMD="$CMD --topic \"${{ inputs.topic }}\""
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: Commit and Push WORKLOG.md Updates
        run: |
          git config --global user.name "Poiema AutoPoster Bot"
          git config --global user.email "bot@poiema-church.local"
          git add WORKLOG.md
          if git diff --staged --quiet; then
            echo "No changes in WORKLOG.md to commit."
          else
            git commit -m "docs(worklog): 🕊️ update daily gospel poster history [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
