name: Daily Gospel Poster Automation

on:
  schedule:
    # Runs daily at 21:00 UTC (06:00 KST next morning)
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '특정 포스터 주제 (비워둘 시 WORKLOG 기반 자동 기획)'
        required: false
        default: ''
      dry_run:
        description: '클라우드 업로드 제외 로컬 테스트 여부'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Google Cloud Service Account
        if: ${{ env.SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        env:
          SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          echo "$SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > service_account.json

      - name: Run Poster Automation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SERVICE_ACCOUNT_JSON_PATH: service_account.json
        run: |
          CMD="python main.py"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ -n "${{ inputs.topic }}" ]; then
            CMD="$CMD --topic \"${{ inputs.topic }}\""
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: Commit and Push WORKLOG.md Updates
        run: |
          git config --global user.name "Poiema AutoPoster Bot"
          git config --global user.email "bot@poiema-church.local"
          git add WORKLOG.md
          if git diff --staged --quiet; then
            echo "No changes in WORKLOG.md to commit."
          else
            git commit -m "docs(worklog): 🕊️ update daily gospel poster history [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
